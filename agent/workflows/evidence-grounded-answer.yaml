name: evidence-grounded-answer
version: 1
purpose: "从论文证据到可引用回答的可追踪工作流"
steps:
  - id: route
    tool: search_papers
    output: task_scope
  - id: evidence
    tool: retrieve_evidence
    input: task_scope
    output: verified_chunks
  - id: answer
    tool: grounded_answer
    input: verified_chunks
    guard: provider_configured
    output: draft_answer
  - id: guard
    tool: citation_guard
    input: [verified_chunks, draft_answer]
    output: final_answer
failure:
  insufficient_evidence: "明确说明证据不足，不补写结论"
  provider_unavailable: "保留原文证据结果，显示配置原因"
