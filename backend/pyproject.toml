[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["integration: requires the real local Elasticsearch node", "real_data: requires explicitly configured delivered JSONL and real HTTP service"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
