name: Verify ScholarLens

on:
  push:
    branches: [zjl]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SCHOLARLENS_RUNTIME_DIR: ${{ runner.temp }}/scholarlens-unit-runtime
      ELASTICSEARCH_URL: http://127.0.0.1:9
      AI_BASE_URL: ''
      AI_API_KEY: ''
      AI_MODEL: ''
      GROBID_URL: ''
      FRONTEND_DIST: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.18.0'
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install frontend locked dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Frontend structure
        run: npm run verify:structure
        working-directory: frontend
      - name: Production build and TypeScript
        run: npm run build:production
        working-directory: frontend
      - name: Install backend locked dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-lock.txt
      - name: Backend dependency consistency
        run: python -m pip check
      - name: Backend syntax and undefined-name checks
        run: python -m ruff check backend --select E9,F63,F7,F82
      - name: Backend tests without external services
        run: >-
          python -m pytest -q --tb=short
          backend/tests/test_ingest.py
          backend/tests/test_pdf_access.py
          backend/tests/test_web.py
          backend/tests/test_agent.py
          backend/tests/test_ai_responses.py
          backend/tests/test_desktop_workspace.py
          backend/tests/test_avatar_isolated.py
          backend/tests/test_account_credentials_isolated.py
          backend/tests/test_admin_boundaries_isolated.py
          backend/tests/test_discovery_metadata_isolated.py
